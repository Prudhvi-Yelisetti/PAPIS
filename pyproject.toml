[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name     = "papis"
version  = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "httpx>=0.27",
    "inotify-simple>=1.3",
    "notify2>=0.3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
papis-api    = "papis.main:app"           # run via uvicorn
papis-daemon = "daemon.papis_daemon:main"
